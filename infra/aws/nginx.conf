upstream backend { server backend:8000; }

map $host $app_root {
    default customer;
    vendor.@DOMAIN_SUFFIX@ vendor;
    delivery.@DOMAIN_SUFFIX@ delivery;
    admin.@DOMAIN_SUFFIX@ admin;
@ADDITIONAL_HOST_MAP@
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
log_format nextou '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

gzip on;
gzip_types text/plain text/css application/json application/javascript text/javascript;
gzip_min_length 1024;
gzip_vary on;

server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name @SERVER_NAMES@;
    ssl_certificate /etc/letsencrypt/live/nextou-production/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextou-production/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    root /usr/share/nginx/html/$app_root;
    charset utf-8;
    client_max_body_size 20M;
    access_log /var/log/nginx/access.log nextou;
    error_log /var/log/nginx/error.log;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    rewrite ^/sa/(api|ws)/(.*)$ /$1/$2 last;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;

    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
    }
    location ~ ^/api/(auth/(login|register)|v1/auth/(login|register))/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
    }
    location /health/ { proxy_pass http://backend; }
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }
    # Keep uploaded files out of shared CDN/browser caches.
    location /media/ { alias /app/media/; add_header Cache-Control "no-store"; }
    location /django_static/ { alias /app/staticfiles/; expires 1y; }
}
